name: Release Nonuglon

# Triggered by pushing a version tag: git tag v1.0.0 && git push origin v1.0.0
#
# Refuses to build if the downloaded Dalamud's API level doesn't match the
# csproj's Dalamud.NET.Sdk major version. Builds Release, zips it as "Nonuglon.zip" (fixed name, so repo.json's
# .../releases/latest/download/Nonuglon.zip links never change), publishes the
# GitHub release (before the sync commit, so a rejected push to master can never
# leave a tag without a release), then syncs
# repo.json's AssemblyVersion/DalamudApiLevel and the csproj's <Version> to
# match, committing both back to master. Presentation text (repo.json's
# Description/Punchline/Tags, the csproj's <Description>) is hand-curated and
# deliberately not touched here.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Check Dalamud matches the SDK's API level
        shell: pwsh
        run: |
          # latest.zip isn't pinned, so when Dalamud ships a new API level before
          # the csproj's Dalamud.NET.Sdk is bumped (or vice versa), stop here
          # instead of releasing a build made against the wrong Dalamud.
          $sdk = Select-String -Path Nonuglon\Nonuglon.csproj -Pattern 'Dalamud\.NET\.Sdk/(\d+)\.' | Select-Object -First 1
          if (-not $sdk) { throw "Could not find the Dalamud.NET.Sdk version in Nonuglon.csproj" }
          $sdkApi = [int]$sdk.Matches[0].Groups[1].Value
          $dll = "$env:AppData\XIVLauncher\addon\Hooks\dev\Dalamud.dll"
          $dalamudApi = [Reflection.AssemblyName]::GetAssemblyName($dll).Version.Major
          Write-Host "Dalamud.NET.Sdk API $sdkApi, downloaded Dalamud API $dalamudApi"
          if ($sdkApi -ne $dalamudApi) {
            throw "API mismatch: csproj targets Dalamud.NET.Sdk $sdkApi but latest Dalamud is API $dalamudApi. Bump the SDK (or wait for Dalamud) before releasing."
          }

      - name: Resolve version from tag
        id: version
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:TAG_NAME -replace '^v', ''
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet build Nonuglon\Nonuglon.csproj -c Release "-p:Version=$env:VERSION" -o build_output

      - name: Package zip
        shell: pwsh
        run: Compress-Archive -Path build_output\* -DestinationPath Nonuglon.zip -Force

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create $env:TAG_NAME Nonuglon.zip --title $env:TAG_NAME --generate-notes

      - name: Sync repo.json from the built manifest
        shell: pwsh
        run: |
          # @(...) in and -InputObject (not a pipe) out: piping a single-element
          # array into ConvertTo-Json unwraps it into a bare {...} object instead
          # of [...] - what broke repo.json after v0.0.1 (Dalamud needs an array).
          $manifest = Get-Content build_output\Nonuglon.json -Raw | ConvertFrom-Json
          $repo = @(Get-Content repo.json -Raw | ConvertFrom-Json)
          $entry = $repo[0]
          $entry.AssemblyVersion = $manifest.AssemblyVersion
          $entry.DalamudApiLevel = $manifest.DalamudApiLevel
          ConvertTo-Json -InputObject $repo -Depth 5 | Set-Content repo.json

      - name: Sync Nonuglon.csproj's checked-in <Version>
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Cosmetic - keeps local dev builds from showing a stale version.
          $csprojPath = "Nonuglon\Nonuglon.csproj"
          $csproj = Get-Content $csprojPath -Raw
          $csproj = $csproj -replace '<Version>[^<]*</Version>', "<Version>$env:VERSION</Version>"
          Set-Content -Path $csprojPath -Value $csproj -NoNewline

      - name: Commit repo.json and csproj version
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repo.json Nonuglon\Nonuglon.csproj
          git diff --cached --quiet --exit-code
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Nothing changed, nothing to commit."
          } else {
            git commit -m "Update repo.json and csproj version for $env:TAG_NAME"
            # master may have moved since the tag was cut (HEAD is detached here).
            git pull --rebase origin master
            if ($LASTEXITCODE -ne 0) { throw "Could not rebase onto master" }
            git push origin HEAD:master
            if ($LASTEXITCODE -ne 0) { throw "Could not push version sync to master" }
          }
