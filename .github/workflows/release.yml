name: Release Nonuglon

# Triggered by pushing a version tag, e.g.:
#   git tag v1.0.0
#   git push origin v1.0.0
#
# Builds Release, zips it, publishes a GitHub Release with that zip attached as
# "Nonuglon.zip" (a fixed name, so repo.json's DownloadLink* URLs - which point at
# .../releases/latest/download/Nonuglon.zip - never need to change), then syncs
# repo.json's AssemblyVersion/DalamudApiLevel from the build's own generated
# manifest AND Nonuglon.csproj's <Version> to match the tag, committing both back
# to master. Description/Punchline/Tags in repo.json, and <Description> in the
# csproj, are hand-curated presentation text, not touched here on purpose - they
# don't need to match each other or the tag.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Resolve version from tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: pwsh
        run: dotnet build Nonuglon\Nonuglon.csproj -c Release -p:Version=${{ steps.version.outputs.version }} -o build_output

      - name: Package zip
        shell: pwsh
        run: Compress-Archive -Path build_output\* -DestinationPath Nonuglon.zip -Force

      - name: Sync repo.json from the built manifest
        shell: pwsh
        run: |
          # Only the fields that must technically match the real build (version and
          # API compatibility) are synced here. Description/Punchline/Tags are
          # repo.json's own presentation text - edit those by hand, they're
          # intentionally left alone.
          # @(...) forces array semantics on the way in, and -InputObject (not a
          # pipe) on the way out, since piping a single-element array into
          # ConvertTo-Json unwraps it and re-serializes as a bare {...} object
          # instead of a [...] array - which is exactly what broke repo.json after
          # the v0.0.1 release (Dalamud's installer requires a JSON array here).
          $manifest = Get-Content build_output\Nonuglon.json -Raw | ConvertFrom-Json
          $repo = @(Get-Content repo.json -Raw | ConvertFrom-Json)
          $entry = $repo[0]
          $entry.AssemblyVersion = $manifest.AssemblyVersion
          $entry.DalamudApiLevel = $manifest.DalamudApiLevel
          ConvertTo-Json -InputObject $repo -Depth 5 | Set-Content repo.json

      - name: Sync Nonuglon.csproj's checked-in <Version>
        shell: pwsh
        run: |
          # Purely cosmetic (the build above already stamped the real
          # AssemblyVersion via -p:Version=), but keeps a plain local
          # `dotnet build`/Build_Nonuglon.bat from showing a stale version number
          # in the Dev Plugins panel between releases.
          $csprojPath = "Nonuglon\Nonuglon.csproj"
          $csproj = Get-Content $csprojPath -Raw
          $csproj = $csproj -replace '<Version>[^<]*</Version>', '<Version>${{ steps.version.outputs.version }}</Version>'
          Set-Content -Path $csprojPath -Value $csproj -NoNewline

      - name: Commit repo.json and csproj version
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repo.json Nonuglon\Nonuglon.csproj
          git diff --cached --quiet --exit-code
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Nothing changed, nothing to commit."
          } else {
            git commit -m "Update repo.json and csproj version for ${{ github.ref_name }}"
            git push origin HEAD:master
          }

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" Nonuglon.zip --title "${{ github.ref_name }}" --generate-notes
